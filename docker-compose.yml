services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - "5433:5432"
    volumes:
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro
      - nimbus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 3s
      retries: 20
volumes:
  nimbus-db:
