[project]
name = "nimbus-support-backend"
version = "0.1.0"
description = "Nimbus customer support agent backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.12",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sse-starlette>=3.7.1",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs the test database"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]  # startup-time reads of small local files

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
